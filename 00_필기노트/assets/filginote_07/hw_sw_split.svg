<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <style>
    .blue{fill:#1d4ed8;font-family:Arial, sans-serif;font-weight:700}
    .text{fill:#111827;font-family:Arial, sans-serif}
    .red{fill:#dc2626;font-family:Arial, sans-serif;font-weight:700}
    .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:8}
    .arrow{stroke:#1d4ed8;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <text x="28" y="36" class="blue" font-size="24">HW vs SW problem split</text>
  <rect x="42" y="78" width="160" height="64" class="box"/>
  <text x="122" y="104" text-anchor="middle" class="blue" font-size="17">증상</text>
  <text x="122" y="126" text-anchor="middle" class="text" font-size="14">통신 실패</text>
  <path d="M202 110 H258" class="arrow"/>
  <rect x="258" y="78" width="190" height="64" class="box"/>
  <text x="353" y="104" text-anchor="middle" class="blue" font-size="17">전기/배선 확인</text>
  <text x="353" y="126" text-anchor="middle" class="text" font-size="14">전원, GND, pull-up</text>
  <path d="M448 110 H504" class="arrow"/>
  <rect x="504" y="78" width="170" height="64" class="box"/>
  <text x="589" y="104" text-anchor="middle" class="blue" font-size="17">파형 확인</text>
  <text x="589" y="126" text-anchor="middle" class="text" font-size="14">scope / logic</text>
  <rect x="92" y="190" width="190" height="64" class="box"/>
  <text x="187" y="216" text-anchor="middle" class="blue" font-size="17">설정 확인</text>
  <text x="187" y="238" text-anchor="middle" class="text" font-size="14">clock, baud, CPOL</text>
  <path d="M282 222 H338" class="arrow"/>
  <rect x="338" y="190" width="190" height="64" class="box"/>
  <text x="433" y="216" text-anchor="middle" class="blue" font-size="17">코드 확인</text>
  <text x="433" y="238" text-anchor="middle" class="text" font-size="14">state, flag, timeout</text>
  <path d="M528 222 H584" class="arrow"/>
  <rect x="584" y="190" width="96" height="64" class="box"/>
  <text x="632" y="216" text-anchor="middle" class="blue" font-size="17">회귀</text>
  <text x="632" y="238" text-anchor="middle" class="text" font-size="14">test</text>
  <text x="360" y="284" text-anchor="middle" class="red" font-size="16">코드만 보지 말고 전원, 배선, 설정, 파형, 로그를 순서대로 좁힌다.</text>
</svg>

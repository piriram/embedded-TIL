  </defs>
  <text x="480" y="38" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial" font-size="26" font-weight="700" fill="#1d4ed8">펌웨어의 위치</text>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">

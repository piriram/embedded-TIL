    <text x="480" y="108" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Application Logic</text>
    <text x="480" y="134" text-anchor="middle" font-size="17" fill="#4b5563">제품 기능 / 제어 조건</text>

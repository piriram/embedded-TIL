<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial" font-size="26" font-weight="700" fill="#1d4ed8">MCU는 작은 컴퓨터 한 칩</text>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">
    <rect x="160" y="75" width="640" height="285" rx="22" fill="#f8fafc" stroke="#111827" stroke-width="4"/>
    <text x="480" y="112" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">Microcontroller Unit</text>
    <rect x="210" y="145" width="190" height="80" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="305" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">CPU</text>
    <text x="305" y="205" text-anchor="middle" font-size="17" fill="#4b5563">명령어 실행</text>
    <rect x="430" y="145" width="150" height="80" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
    <text x="505" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Flash</text>
    <text x="505" y="205" text-anchor="middle" font-size="17" fill="#4b5563">코드 저장</text>
    <rect x="610" y="145" width="140" height="80" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="680" y="178" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">SRAM</text>
    <text x="680" y="205" text-anchor="middle" font-size="17" fill="#4b5563">변수 / stack</text>
    <rect x="210" y="255" width="540" height="70" rx="12" fill="#fff1f2" stroke="#dc2626" stroke-width="3"/>
    <text x="480" y="283" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Peripherals</text>
    <text x="480" y="312" text-anchor="middle" font-size="18" fill="#111827">GPIO · UART · Timer · I2C · SPI · CAN · ADC · PWM</text>
    <text x="480" y="392" text-anchor="middle" font-size="19" fill="#dc2626">CPU만 있는 것이 아니라 메모리와 주변장치가 함께 들어 있다</text>
  </g>
</svg>

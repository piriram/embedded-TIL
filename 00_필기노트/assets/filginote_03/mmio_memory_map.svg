<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500">
  <rect width="960" height="500" fill="#ffffff"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">
    <text x="480" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">Memory-Mapped I/O 주소 감각</text>
    <rect x="120" y="90" width="370" height="320" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
    <text x="305" y="125" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">MCU Address Space</text>
    <rect x="155" y="150" width="300" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="180" y="180" font-size="18" font-weight="700" fill="#1d4ed8">0x08000000</text>
    <text x="330" y="180" font-size="21" font-weight="700" fill="#111827">Flash</text>
    <text x="330" y="205" font-size="17" fill="#4b5563">프로그램 코드</text>
    <rect x="155" y="235" width="300" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
    <text x="180" y="265" font-size="18" font-weight="700" fill="#15803d">0x20000000</text>
    <text x="330" y="265" font-size="21" font-weight="700" fill="#111827">SRAM</text>
    <text x="330" y="290" font-size="17" fill="#4b5563">실행 중 변수 / stack</text>
    <rect x="155" y="320" width="300" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="180" y="350" font-size="18" font-weight="700" fill="#dc2626">0x40000000</text>
    <text x="330" y="350" font-size="21" font-weight="700" fill="#111827">Peripheral</text>
    <text x="330" y="375" font-size="17" fill="#4b5563">하드웨어 레지스터</text>

    <rect x="600" y="130" width="245" height="240" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <text x="722" y="168" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Peripheral 내부</text>
    <rect x="635" y="195" width="175" height="40" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="722" y="222" text-anchor="middle" font-size="18" fill="#111827">GPIO 레지스터</text>
    <rect x="635" y="250" width="175" height="40" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="722" y="277" text-anchor="middle" font-size="18" fill="#111827">UART 레지스터</text>
    <rect x="635" y="305" width="175" height="40" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
    <text x="722" y="332" text-anchor="middle" font-size="18" fill="#111827">Timer 레지스터</text>

    <path d="M462 355 C535 355 535 250 590 250" fill="none" stroke="#dc2626" stroke-width="4"/>
    <polygon points="590,250 578,244 578,256" fill="#dc2626"/>
    <text x="480" y="455" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">핵심: CPU는 주변장치도 메모리 주소처럼 접근한다</text>
  </g>
</svg>

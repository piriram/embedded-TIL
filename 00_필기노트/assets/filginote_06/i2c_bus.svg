<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <style>
    .blue{fill:#1d4ed8;font-family:Arial, sans-serif;font-weight:700}
    .text{fill:#111827;font-family:Arial, sans-serif}
    .red{fill:#dc2626;font-family:Arial, sans-serif;font-weight:700}
    .wire{stroke:#111827;stroke-width:4}
    .pull{stroke:#1d4ed8;stroke-width:3}
    .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:8}
  </style>
  <text x="28" y="34" class="blue" font-size="24">I2C: SDA / SCL + Pull-up</text>
  <line x1="100" y1="110" x2="650" y2="110" class="wire"/>
  <line x1="100" y1="180" x2="650" y2="180" class="wire"/>
  <text x="56" y="116" class="blue" font-size="18">SCL</text>
  <text x="56" y="186" class="blue" font-size="18">SDA</text>
  <line x1="160" y1="72" x2="160" y2="110" class="pull"/>
  <line x1="210" y1="72" x2="210" y2="180" class="pull"/>
  <text x="185" y="62" text-anchor="middle" class="blue" font-size="16">4.7k pull-up to 3.3V</text>
  <rect x="88" y="220" width="150" height="55" class="box"/>
  <text x="163" y="245" text-anchor="middle" class="blue" font-size="17">Controller</text>
  <text x="163" y="266" text-anchor="middle" class="text" font-size="14">STM32 I2C1</text>
  <rect x="315" y="220" width="150" height="55" class="box"/>
  <text x="390" y="245" text-anchor="middle" class="blue" font-size="17">Target</text>
  <text x="390" y="266" text-anchor="middle" class="text" font-size="14">MPU6050 0x68</text>
  <rect x="530" y="220" width="150" height="55" class="box"/>
  <text x="605" y="245" text-anchor="middle" class="blue" font-size="17">Target</text>
  <text x="605" y="266" text-anchor="middle" class="text" font-size="14">Other addr</text>
  <line x1="163" y1="220" x2="163" y2="180" class="wire"/>
  <line x1="390" y1="220" x2="390" y2="180" class="wire"/>
  <line x1="605" y1="220" x2="605" y2="180" class="wire"/>
  <text x="360" y="142" text-anchor="middle" class="red" font-size="17">open-drain: 장치는 LOW만 직접 당김, HIGH는 pull-up</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <style>
    .blue{fill:#1d4ed8;font-family:Arial, sans-serif;font-weight:700}
    .text{fill:#111827;font-family:Arial, sans-serif}
    .red{fill:#dc2626;font-family:Arial, sans-serif;font-weight:700}
    .box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:8}
    .wire{stroke:#111827;stroke-width:3;marker-end:url(#arrow)}
    .clock{stroke:#1d4ed8;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827"/>
    </marker>
  </defs>
  <text x="28" y="34" class="blue" font-size="24">SPI: MOSI / MISO / SCLK / CS</text>
  <rect x="70" y="95" width="160" height="110" class="box"/>
  <text x="150" y="145" text-anchor="middle" class="blue" font-size="20">Controller</text>
  <text x="150" y="172" text-anchor="middle" class="text" font-size="15">MCU</text>
  <rect x="490" y="95" width="160" height="110" class="box"/>
  <text x="570" y="145" text-anchor="middle" class="blue" font-size="20">Peripheral</text>
  <text x="570" y="172" text-anchor="middle" class="text" font-size="15">Sensor / Flash</text>
  <line x1="230" y1="110" x2="490" y2="110" class="wire"/>
  <text x="360" y="102" text-anchor="middle" class="text" font-size="15">MOSI</text>
  <line x1="490" y1="140" x2="230" y2="140" class="wire"/>
  <text x="360" y="132" text-anchor="middle" class="text" font-size="15">MISO</text>
  <line x1="230" y1="170" x2="490" y2="170" class="clock"/>
  <text x="360" y="162" text-anchor="middle" class="blue" font-size="15">SCLK</text>
  <line x1="230" y1="200" x2="490" y2="200" class="wire"/>
  <text x="360" y="193" text-anchor="middle" class="text" font-size="15">CS</text>
  <text x="360" y="254" text-anchor="middle" class="red" font-size="17">클럭 기준으로 동시에 밀고 받는 full-duplex 통신</text>
</svg>

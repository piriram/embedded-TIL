<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <rect width="720" height="300" fill="#ffffff"/>
  <style>
    .blue{fill:#1d4ed8;font-family:Arial, sans-serif;font-weight:700}
    .text{fill:#111827;font-family:Arial, sans-serif}
    .red{fill:#dc2626;font-family:Arial, sans-serif;font-weight:700}
    .axis{stroke:#64748b;stroke-width:2}
    .wave{stroke:#111827;stroke-width:4;fill:none}
    .guide{stroke:#1d4ed8;stroke-width:2;stroke-dasharray:6 6}
    .high{fill:#dbeafe}
  </style>
  <text x="28" y="34" class="blue" font-size="24">PWM = ARR로 주기, CCR로 duty</text>
  <text x="74" y="82" class="text" font-size="16">Counter</text>
  <line x1="100" y1="230" x2="640" y2="230" class="axis"/>
  <line x1="100" y1="70" x2="100" y2="230" class="axis"/>
  <polyline points="100,230 370,80 640,230" class="wave"/>
  <line x1="100" y1="80" x2="650" y2="80" class="guide"/>
  <text x="656" y="86" class="blue" font-size="16">ARR</text>
  <line x1="100" y1="140" x2="650" y2="140" class="guide"/>
  <text x="656" y="146" class="blue" font-size="16">CCR</text>
  <rect x="100" y="248" width="270" height="18" class="high"/>
  <rect x="370" y="248" width="270" height="18" fill="#f1f5f9"/>
  <text x="235" y="286" text-anchor="middle" class="red" font-size="16">HIGH 구간</text>
  <text x="505" y="286" text-anchor="middle" class="text" font-size="16">LOW 구간</text>
  <line x1="370" y1="70" x2="370" y2="270" class="guide"/>
  <text x="370" y="62" text-anchor="middle" class="red" font-size="16">CCR 비교 시점</text>
  <text x="360" y="114" text-anchor="middle" class="text" font-size="16">CCR을 키우면 HIGH 시간이 늘어 duty 증가</text>
</svg>

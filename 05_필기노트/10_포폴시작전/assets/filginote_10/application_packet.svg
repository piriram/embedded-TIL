<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270">
  <style>
    .center{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2;rx:12}
    .card{fill:#ffffff;stroke:#94a3b8;stroke-width:2;rx:10}
    .text{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#111827;font-size:15px}
    .title{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#1d4ed8;font-size:18px;font-weight:700}
    .red{fill:#dc2626;font-weight:700}
    .line{stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="266" y="92" width="228" height="86" class="center"/>
  <text x="380" y="126" text-anchor="middle" class="title">지원 패키지</text>
  <text x="380" y="154" text-anchor="middle" class="text">검증 가능한 펌웨어 신입</text>
  <rect x="30" y="28" width="190" height="76" class="card"/>
  <text x="125" y="58" text-anchor="middle" class="title">이력서</text>
  <text x="125" y="84" text-anchor="middle" class="text">TTA -> STM32 -> iOS</text>
  <line x1="220" y1="76" x2="266" y2="112" class="line"/>
  <rect x="540" y="28" width="190" height="76" class="card"/>
  <text x="635" y="58" text-anchor="middle" class="title">자기소개서</text>
  <text x="635" y="84" text-anchor="middle" class="text">JD 요구에 맞춘 문단</text>
  <line x1="540" y1="76" x2="494" y2="112" class="line"/>
  <rect x="30" y="170" width="190" height="76" class="card"/>
  <text x="125" y="200" text-anchor="middle" class="title">포트폴리오</text>
  <text x="125" y="226" text-anchor="middle" class="text">I2C/CAN/검증 증거</text>
  <line x1="220" y1="206" x2="266" y2="158" class="line"/>
  <rect x="540" y="170" width="190" height="76" class="card"/>
  <text x="635" y="200" text-anchor="middle" class="title">면접 카드</text>
  <text x="635" y="226" text-anchor="middle" class="text">30초 답변 + 약점 방어</text>
  <line x1="540" y1="206" x2="494" y2="158" class="line"/>
  <text x="380" y="256" text-anchor="middle" class="text red">각 문서는 같은 정체성을 반복해야 함</text>
</svg>

      <text x="860" y="178" font-size="22" font-weight="700" fill="#111827">main()</text>
    </g>
    <line x1="200" y1="170" x2="225" y2="170" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="390" y1="170" x2="415" y2="170" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="580" y1="170" x2="605" y2="170" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="770" y1="170" x2="795" y2="170" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="480" y="285" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">핵심: 전원이 켜졌다고 바로 main부터 실행되는 것은 아니다</text>

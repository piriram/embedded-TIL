<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <rect width="960" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">
    <text x="480" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">MCU 부팅 흐름</text>
    <g font-size="18" text-anchor="middle">
      <rect x="45" y="125" width="145" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
      <text x="117" y="178" font-size="22" font-weight="700" fill="#111827">Reset</text>
      <rect x="235" y="125" width="145" height="90" rx="12" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
      <text x="307" y="162" font-size="21" font-weight="700" fill="#111827">Vector</text>
      <text x="307" y="190" fill="#4b5563">table 확인</text>
      <rect x="425" y="125" width="145" height="90" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/>
      <text x="497" y="162" font-size="21" font-weight="700" fill="#111827">Reset</text>
      <text x="497" y="190" fill="#4b5563">handler</text>
      <rect x="615" y="125" width="145" height="90" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/>
      <text x="687" y="162" font-size="21" font-weight="700" fill="#111827">C 환경</text>

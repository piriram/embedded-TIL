<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420">
  <rect width="960" height="420" fill="#ffffff"/>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">
    <text x="480" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">Vector table은 handler 주소 목록</text>
    <rect x="110" y="85" width="330" height="260" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
    <text x="275" y="122" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">Vector Table</text>
    <g font-size="18">
      <rect x="145" y="145" width="260" height="38" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="165" y="170" fill="#111827">0: Initial SP</text>
      <rect x="145" y="183" width="260" height="38" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="165" y="208" fill="#111827">1: Reset Handler</text>
      <rect x="145" y="221" width="260" height="38" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="165" y="246" fill="#111827">2: NMI Handler</text>
      <rect x="145" y="259" width="260" height="38" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
      <text x="165" y="284" fill="#111827">3: HardFault Handler</text>
      <rect x="145" y="297" width="260" height="38" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <text x="165" y="322" fill="#111827">... UART / Timer ISR</text>
    </g>
    <rect x="585" y="150" width="245" height="145" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="707" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">이벤트 발생</text>
    <text x="707" y="225" text-anchor="middle" font-size="19" fill="#111827">Reset / Fault / Interrupt</text>
    <text x="707" y="255" text-anchor="middle" font-size="18" fill="#4b5563">번호에 맞는 함수 실행</text>
    <path d="M445 205 C520 205 520 220 575 220" fill="none" stroke="#2563eb" stroke-width="4"/>
    <polygon points="575,220 563,214 563,226" fill="#2563eb"/>
    <text x="480" y="382" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">핵심: 인터럽트가 오면 CPU는 표에서 해당 handler 주소를 찾아간다</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380">
  <rect width="960" height="380" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">
    <text x="480" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1d4ed8">MCU가 하드웨어를 제어하는 흐름</text>
    <rect x="55" y="115" width="205" height="145" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="157" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">C 코드 / HAL</text>
    <text x="157" y="190" text-anchor="middle" font-size="18" fill="#111827">HAL_GPIO_WritePin()</text>
    <text x="157" y="220" text-anchor="middle" font-size="18" fill="#4b5563">또는 레지스터 직접 접근</text>

    <rect x="360" y="95" width="240" height="185" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
    <text x="480" y="135" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">CPU</text>
    <rect x="395" y="160" width="170" height="78" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="3"/>
    <text x="480" y="193" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Peripheral Register</text>
    <text x="480" y="220" text-anchor="middle" font-size="17" fill="#4b5563">주소에 값 읽기/쓰기</text>

    <rect x="700" y="115" width="205" height="145" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="802" y="155" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">하드웨어 동작</text>
    <text x="802" y="190" text-anchor="middle" font-size="19" fill="#111827">GPIO 핀 HIGH/LOW</text>
    <text x="802" y="220" text-anchor="middle" font-size="18" fill="#4b5563">LED / UART / Timer</text>

    <line x1="270" y1="188" x2="350" y2="188" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="610" y1="188" x2="690" y2="188" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="310" y="165" text-anchor="middle" font-size="17" fill="#1d4ed8">명령 실행</text>
    <text x="650" y="165" text-anchor="middle" font-size="17" fill="#1d4ed8">레지스터 반영</text>
    <text x="480" y="335" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">핵심: HAL을 써도 아래에서는 결국 레지스터 주소를 읽고 쓴다</text>
  </g>
</svg>

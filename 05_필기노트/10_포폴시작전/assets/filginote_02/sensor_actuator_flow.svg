<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <rect width="960" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial" font-size="26" font-weight="700" fill="#1d4ed8">센서와 액추에이터</text>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">
    <rect x="55" y="95" width="245" height="180" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="178" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Sensor</text>
    <text x="178" y="160" text-anchor="middle" font-size="18" fill="#111827">세상을 읽는 부품</text>
    <text x="178" y="200" text-anchor="middle" font-size="17" fill="#4b5563">온도 센서 · 버튼</text>
    <text x="178" y="228" text-anchor="middle" font-size="17" fill="#4b5563">거리 센서 · IMU</text>

    <rect x="375" y="105" width="210" height="160" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
    <text x="480" y="155" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">MCU</text>
    <text x="480" y="190" text-anchor="middle" font-size="18" fill="#111827">입력 판단</text>
    <text x="480" y="220" text-anchor="middle" font-size="18" fill="#111827">출력 제어</text>

    <rect x="660" y="95" width="245" height="180" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="783" y="130" text-anchor="middle" font-size="23" font-weight="700" fill="#111827">Actuator</text>
    <text x="783" y="160" text-anchor="middle" font-size="18" fill="#111827">실제 동작을 만드는 부품</text>
    <text x="783" y="200" text-anchor="middle" font-size="17" fill="#4b5563">LED · 모터</text>
    <text x="783" y="228" text-anchor="middle" font-size="17" fill="#4b5563">팬 · 부저 · 릴레이</text>

    <line x1="305" y1="185" x2="365" y2="185" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="590" y1="185" x2="650" y2="185" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="335" y="160" text-anchor="middle" font-size="17" fill="#1d4ed8">입력</text>
    <text x="620" y="160" text-anchor="middle" font-size="17" fill="#1d4ed8">출력 / 제어</text>
    <text x="480" y="340" text-anchor="middle" font-size="19" fill="#dc2626">센서만 있으면 읽기, 액추에이터까지 있어야 제어가 된다</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <rect width="960" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>
  <text x="480" y="38" text-anchor="middle" font-family="Apple SD Gothic Neo, Noto Sans KR, Arial" font-size="26" font-weight="700" fill="#1d4ed8">임베디드 시스템 기본 흐름</text>
  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial">
    <rect x="70" y="105" width="210" height="130" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <text x="175" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">입력</text>
    <text x="175" y="180" text-anchor="middle" font-size="20" fill="#111827">버튼 / 센서</text>
    <text x="175" y="210" text-anchor="middle" font-size="18" fill="#4b5563">외부 상태를 읽음</text>

    <rect x="375" y="95" width="210" height="150" rx="14" fill="#f8fafc" stroke="#111827" stroke-width="3"/>
    <text x="480" y="138" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">MCU</text>
    <text x="480" y="174" text-anchor="middle" font-size="20" fill="#111827">코드 실행</text>
    <text x="480" y="205" text-anchor="middle" font-size="18" fill="#4b5563">판단 / 제어</text>

    <rect x="680" y="105" width="210" height="130" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
    <text x="785" y="145" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">출력</text>
    <text x="785" y="180" text-anchor="middle" font-size="20" fill="#111827">LED / 모터 / 부저</text>
    <text x="785" y="210" text-anchor="middle" font-size="18" fill="#4b5563">실제 동작을 만듦</text>

    <line x1="285" y1="170" x2="365" y2="170" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="590" y1="170" x2="670" y2="170" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="325" y="145" text-anchor="middle" font-size="17" fill="#1d4ed8">센서 입력</text>
    <text x="630" y="145" text-anchor="middle" font-size="17" fill="#1d4ed8">액추에이터 출력</text>
  </g>
</svg>
